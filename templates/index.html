<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>EscalaP1 — Acesso e Painel Operacional</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        *:focus-visible { outline: 3px solid #ff9900 !important; outline-offset: 2px !important; }
        .btn-p1 { background-color: #0f294a; color: #fff; min-height: 48px; }
    </style>
</head>
<body class="bg-light">
    <nav class="navbar navbar-dark" style="background-color: #0f294a;">
        <div class="container"><span class="navbar-brand fw-bold">EscalaP1 — Gestão de Efetivo e Escalas</span></div>
    </nav>
    <main class="container my-5" style="max-width: 480px;">
        <div class="card shadow-sm p-4">
            <h1 class="h4 fw-bold mb-3">Acesso Restrito — Seção P1</h1>
            <form action="/login" method="POST">
                <div class="mb-3">
                    <label for="re" class="form-label fw-bold">Registro Estatístico (RE)</label>
                    <input type="text" id="re" name="re" class="form-control" style="min-height: 48px;" required>
                </div>
                <div class="mb-4">
                    <label for="senha" class="form-label fw-bold">Senha</label>
                    <input type="password" id="senha" name="senha" class="form-control" style="min-height: 48px;" required>
                </div>
                <button type="submit" class="btn btn-p1 w-100 fw-bold">Entrar no Sistema</button>
            </form>
        </div>
    </main>
</body>
</html>
